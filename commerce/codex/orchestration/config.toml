approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
project_doc_fallback_filenames = ["AGENTS.md"]

[features]
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true

# Official Klaviyo remote MCP. It starts read-only and uses a reduced core tool set.
# Authenticate after installation with: codex mcp login klaviyo
[mcp_servers.klaviyo]
url = "https://mcp.klaviyo.com/mcp?read-only=true&core-tools-only=true"
enabled = true
required = false
default_tools_approval_mode = "prompt"
startup_timeout_sec = 30
tool_timeout_sec = 90

# Official Shopify developer MCP for current docs, schemas, and validation.
[mcp_servers.shopify-dev-mcp]
command = "npx"
args = ["-y", "@shopify/dev-mcp@latest"]
enabled = true
required = false
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 90

# Django does not publish an official MCP server. Context7 provides current documentation lookup without exposing a Django application's data or models.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true
required = false
default_tools_approval_mode = "auto"
tool_timeout_sec = 60

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false
